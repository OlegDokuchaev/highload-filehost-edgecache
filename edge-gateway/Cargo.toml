[package]
name = "edge-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
apigate = "0.2.4"
tokio = { version = "1", features = ["full"] }
config = "0.14"
serde = { version = "1", features = ["derive"] }
humantime-serde = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
