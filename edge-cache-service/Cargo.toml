[package]
name = "edge-cache-service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1.9"
memmap2 = "0.9"
futures-util = "0.3"
async-stream = "0.3"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
config = "0.14"
humantime-serde = "1"
fs4 = { version = "0.13", features = ["tokio"] }
utoipa = "5"
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
mockall = "0.13"
tempfile = "3"
