[package]
name = "edge-cache-service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
async-stream = "0.3"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
config = "0.14"
humantime-serde = "1"
fs4 = { version = "0.13", features = ["tokio"] }

[dev-dependencies]
mockall = "0.13"
tempfile = "3"
