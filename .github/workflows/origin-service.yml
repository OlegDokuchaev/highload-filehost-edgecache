name: Origin Service CI

on:
  push:
    branches: ["**"]
    paths:
      - "origin-service/**"
      - ".github/workflows/origin-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "origin-service/**"
      - ".github/workflows/origin-service.yml"

jobs:
  # ===========================
  # 1. Linting
  # ===========================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ./origin-service/src
          args: --timeout=5m ./...

      - name: Run go fmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  # ===========================
  # 2. Unit tests
  # ===========================
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run unit tests via docker-compose
        run: |
          docker-compose up --build --abort-on-container-exit test-unit
          
      - name: Clean up containers
        if: always()
        run: docker-compose down -v

  # ==========================================
  # 3. Integration tests
  # ==========================================
  integration:
    name: Integration tests
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run integration tests via docker-compose
        run: |
          docker-compose up --build --abort-on-container-exit test-integration

      - name: Clean up containers
        if: always()
        run: docker-compose down -v
