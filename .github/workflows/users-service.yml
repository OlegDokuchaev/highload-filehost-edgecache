name: Users Service CI

on:
  push:
    branches: ["**"]
    paths:
      - "users-service/**"
      - ".github/workflows/users-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "users-service/**"
      - ".github/workflows/users-service.yml"

defaults:
  run:
    working-directory: users-service

jobs:
  # ===========================
  # 1. Linting
  # ===========================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - &checkout
        name: Checkout sources
        uses: actions/checkout@v4

      - &setup-python
        name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: users-service/pyproject.toml

      - &install-deps
        name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Run type check
        run: mypy src

  # ===========================
  # 2. Unit tests
  # ===========================
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - *checkout
      - *setup-python
      - *install-deps

      - name: Run unit tests
        run: pytest tests/unit -q

  # ==========================================
  # 3. Integration tests
  # ==========================================
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - *checkout
      - *setup-python
      - *install-deps

      - name: Run integration tests
        run: pytest tests/integration -q

  # ===========================
  # 4. Build & Push image
  # ===========================
  deploy:
    name: Build & Push image
    if: github.ref == 'refs/heads/main'
    needs: [lint, unit, integration]
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./users-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/users-service:latest
            ghcr.io/${{ github.repository_owner }}/users-service:${{ github.sha }}
