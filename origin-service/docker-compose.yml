services:
  origin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: origin-service
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_started
      stub:
        condition: service_started
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-test:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    tmpfs: /data
    restart: unless-stopped

  origin-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: origin-service-test
    env_file:
      - .env
    depends_on:
      minio-test:
        condition: service_started
      stub:
        condition: service_started
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

  stub:
    build:
      context: .
      dockerfile: Dockerfile.stub
    ports:
      - "8081:8081"
    restart: unless-stopped

  test-unit:
    build:
      context: .
      dockerfile: Dockerfile.unit
    container_name: test-unit
    depends_on:
      minio-test:
        condition: service_started
    environment:
      MINIO_ENDPOINT: minio-test:9000
      MINIO_ACCESS_KEY: testuser
      MINIO_SECRET_KEY: testpassword
    restart: "no"

  test-integration:
    build:
      context: .
      dockerfile: Dockerfile.integration
    container_name: test-integration
    depends_on:
      origin-test:
        condition: service_started
    restart: "no"

volumes:
  minio_data:
