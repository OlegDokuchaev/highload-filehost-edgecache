services:
  origin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: origin-service
    depends_on:
      minio:
        condition: service_started
    ports:
      - "8080:8080"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-test:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    tmpfs: /data
    restart: unless-stopped

  origin-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: origin-service-test
    depends_on:
      minio-test:
        condition: service_started
      stub:
        condition: service_started
    ports:
      - "8080:8080"
    restart: unless-stopped

  stub:
    build:
      context: .
      dockerfile: Dockerfile.stub
    ports:
      - "8081:8081"
    restart: unless-stopped

  test-unit:
    build:
      context: .
      dockerfile: Dockerfile.unit
    container_name: test-unit
    depends_on:
      minio-test:
        condition: service_started
    environment:
      MINIO_ENDPOINT: minio-test:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    restart: "no"

  test-integration:
    build:
      context: .
      dockerfile: Dockerfile.integration
    container_name: test-integration
    depends_on:
      origin-test:
        condition: service_started
      stub:
        condition: service_started
    restart: "no"

volumes:
  minio_data:
